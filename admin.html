<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khazar Inji — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f4f6f9;color:#333;min-height:100vh}

/* LOGIN */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.login-card{background:#fff;border-radius:16px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;color:#333;margin-top:10px}
.login-logo p{font-size:12px;color:#999;margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.login-logo .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto}
.field-label{font-size:12px;font-weight:600;color:#555;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.field-input{width:100%;height:44px;border:1.5px solid #e0e0e0;border-radius:8px;padding:0 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;background:#fafafa}
.field-input:focus{border-color:#667eea;background:#fff}
.field-group{margin-bottom:16px}
.login-btn{width:100%;height:46px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:8px;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-err{background:#fff2f2;border:1px solid #ffcdd2;color:#c62828;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;display:none;text-align:center}

/* LAYOUT */
.app{display:none;min-height:100vh}
.app.show{display:flex;flex-direction:column}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid #e8e8e8;height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.topbar-logo{font-size:18px;font-weight:700;color:#667eea;letter-spacing:-.5px}
.topbar-logo span{color:#764ba2}
.topbar-badge{font-size:10px;background:#667eea;color:#fff;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar-user{font-size:13px;color:#666;display:flex;align-items:center;gap:8px}
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
.topbar-link{font-size:12px;color:#667eea;text-decoration:none;padding:6px 12px;border:1px solid #667eea;border-radius:6px;transition:all .2s}
.topbar-link:hover{background:#667eea;color:#fff}
.logout-btn{font-size:12px;color:#999;cursor:pointer;padding:6px 12px;border:1px solid #e0e0e0;border-radius:6px;transition:all .2s;background:none}
.logout-btn:hover{border-color:#e53935;color:#e53935}

/* SIDEBAR */
.main-layout{display:flex;flex:1}
.sidebar{width:240px;background:#fff;border-right:1px solid #e8e8e8;padding:16px 0;flex-shrink:0;height:calc(100vh - 60px);position:sticky;top:60px;overflow-y:auto}
.sidebar-section{padding:12px 20px 6px;font-size:10px;font-weight:700;color:#aaa;letter-spacing:1.5px;text-transform:uppercase}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:#555;cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.sidebar-item:hover{background:#f5f0ff;color:#667eea}
.sidebar-item.active{background:#f5f0ff;color:#667eea;border-left-color:#667eea;font-weight:600}
.sidebar-item .si-icon{font-size:16px;width:20px;text-align:center}
.sidebar-item .si-badge{margin-left:auto;background:#f0f0f0;color:#888;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.sidebar-item.active .si-badge{background:#667eea20;color:#667eea}

/* CONTENT */
.content{flex:1;padding:24px;overflow-y:auto}

/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:#222}
.page-sub{font-size:12px;color:#999;margin-top:2px}
.breadcrumb{font-size:12px;color:#aaa;margin-bottom:6px}
.breadcrumb span{color:#667eea}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f0f0f0}
.stat-card .sc-val{font-size:32px;font-weight:700;color:#333;line-height:1}
.stat-card .sc-label{font-size:12px;color:#999;margin-top:6px;font-weight:500}
.stat-card .sc-icon{font-size:24px;margin-bottom:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;border:none}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.4)}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:#fff;color:#555;border:1.5px solid #e0e0e0}
.btn-secondary:hover{border-color:#667eea;color:#667eea}
.btn-danger{background:#fff;color:#e53935;border:1.5px solid #ffcdd2}
.btn-danger:hover{background:#e53935;color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}

/* FILTER CHIPS */
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;border:1.5px solid transparent}
.chip-all{background:#667eea;color:#fff}
.chip-cat{background:#f0f0f0;color:#555}
.chip-cat:hover{background:#667eea20;color:#667eea;border-color:#667eea}
.chip-cat.active{background:#667eea;color:#fff}

/* SEARCH BAR */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;height:38px;border:1.5px solid #e0e0e0;border-radius:8px;padding:0 14px 0 36px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:#667eea}
.search-box .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-size:14px}

/* TABLE */
.table-wrap{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f0f0f0;overflow:hidden}
.table-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;background:#fafafa}
.table-header span{font-size:13px;font-weight:600;color:#444}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 16px;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid #f0f0f0;background:#fafafa;white-space:nowrap}
td{padding:12px 16px;font-size:13px;color:#444;border-bottom:1px solid #f8f8f8;vertical-align:middle}
tr:hover td{background:#fafbff}
tr:last-child td{border-bottom:none}
.td-img{width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid #f0f0f0;background:#f8f8f8}
.td-img-placeholder{width:48px;height:48px;border-radius:8px;background:#f5f0ff;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid #e8e0ff}
.td-name{font-weight:600;color:#222}
.td-price{font-weight:700;color:#667eea;font-size:15px}
.cat-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#f0f0f0;color:#666;white-space:nowrap}
.status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-active{background:#e8f5e9;color:#2e7d32}
.status-inactive{background:#fff3e0;color:#e65100}
.actions{display:flex;gap:6px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:17px;font-weight:700;color:#222}
.modal-close{background:none;border:none;font-size:20px;color:#aaa;cursor:pointer;padding:4px;line-height:1}
.modal-close:hover{color:#333}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid #f0f0f0;display:flex;gap:10px;justify-content:flex-end}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}
.form-group label{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
.form-control{width:100%;height:42px;border:1.5px solid #e0e0e0;border-radius:8px;padding:0 14px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;background:#fafafa}
.form-control:focus{border-color:#667eea;background:#fff}
select.form-control{cursor:pointer}
select.form-control option{background:#fff}

/* IMG PREVIEW */
.img-preview{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1.5px solid #e0e0e0;display:none;margin-top:8px}
.img-preview.show{display:block}

/* TOAST */
.toast{position:fixed;top:20px;right:20px;background:#222;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateX(60px);transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(0)}
.toast.success{background:#2e7d32}
.toast.error{background:#c62828}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:#aaa}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid #f0f0f0;background:#fafafa}
.pagination-info{font-size:12px;color:#999}
.pagination-btns{display:flex;gap:4px}
.page-btn{padding:5px 10px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;font-family:'Inter',sans-serif;transition:all .2s}
.page-btn:hover,.page-btn.active{background:#667eea;color:#fff;border-color:#667eea}

/* CONFIRM DIALOG */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-overlay.open{opacity:1;pointer-events:all}
.confirm-box{background:#fff;border-radius:14px;padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.confirm-icon{font-size:48px;margin-bottom:12px}
.confirm-title{font-size:17px;font-weight:700;color:#222;margin-bottom:8px}
.confirm-sub{font-size:13px;color:#888;margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">Silmək istəyirsiniz?</div>
    <div class="confirm-sub" id="confirmMsg">Bu məhsulu silmək istədiyinizə əminsiniz?</div>
    <div class="confirm-btns">
      <button class="btn btn-secondary" onclick="closeConfirm()">Ləğv et</button>
      <button class="btn btn-danger" id="confirmOk">Sil</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🍽️</div>
      <h1>Khazar Inji</h1>
      <p>Admin Panel</p>
    </div>
    <div class="field-group">
      <label class="field-label">İstifadəçi adı</label>
      <input class="field-input" type="text" id="loginUser" placeholder="admin" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field-group">
      <label class="field-label">Şifrə</label>
      <input class="field-input" type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Daxil ol</button>
    <div class="login-err" id="loginErr">Yanlış istifadəçi adı və ya şifrə!</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">Khazar<span>Inji</span></div>
    <div class="topbar-badge">ADMIN</div>
    <div class="topbar-right">
      <a href="index.html" target="_blank" class="topbar-link">🔗 Menyuya bax</a>
      <div class="topbar-user">
        <div class="topbar-avatar">A</div>
        <span>admin</span>
      </div>
      <button class="logout-btn" onclick="doLogout()">Çıxış</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar"></div>

    <!-- CONTENT -->
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ITEM MODAL -->
<div class="modal-overlay" id="itemModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Məhsul əlavə et</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group">
          <label>Məhsulun adı *</label>
          <input class="form-control" type="text" id="editName" placeholder="Məs: Toyuq salatı">
        </div>
        <div class="form-group">
          <label>Qiymət (₼) *</label>
          <input class="form-control" type="number" id="editPrice" placeholder="0" min="0" step="0.5">
        </div>
      </div>
      <div class="form-group">
        <label>Kateqoriya *</label>
        <select class="form-control" id="editCat"></select>
      </div>
      <div class="form-group">
        <label>Açıqlama / ölçü</label>
        <input class="form-control" type="text" id="editDesc" placeholder="Məs: 300q, 50cl...">
      </div>
      <div class="form-group">
        <label>Şəkil URL</label>
        <input class="form-control" type="url" id="editImg" placeholder="https://..." oninput="previewImg()">
        <img class="img-preview" id="imgPreview" alt="preview">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Ləğv et</button>
      <button class="btn btn-primary" onclick="saveItem()">✅ Yadda saxla</button>
    </div>
  </div>
</div>

<script>
// ============ AUTH ============
const ADMIN_PASS = 'Khazarinji737989@';

function doLogin() {
  const u = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPass').value;
  if (u === 'admin' && p === ADMIN_PASS) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').classList.add('show');
    initApp();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
function doLogout() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('app').classList.remove('show');
}

// ============ DATA ============
const CATS = [
  {id:'setler',name:'Setlər',icon:'🎁'},
  {id:'gin',name:'Gin',icon:'🍸'},
  {id:'pastalar',name:'Pastalar',icon:'🍝'},
  {id:'steykler',name:'Steyklər',icon:'🥩'},
  {id:'souslar',name:'Souslar',icon:'🫙'},
  {id:'soyuq',name:'Soyuq Qəlyanaltı',icon:'🥗'},
  {id:'isti',name:'İsti Qəlyanaltı',icon:'🍳'},
  {id:'salatlar',name:'Salatlar',icon:'🥙'},
  {id:'sorbalar',name:'Şorbalar',icon:'🍲'},
  {id:'toyuq',name:'Toyuq',icon:'🍗'},
  {id:'et',name:'Ət Yeməkləri',icon:'🥩'},
  {id:'qarnirlər',name:'Qarnirlər',icon:'🥔'},
  {id:'baliq',name:'Balıq',icon:'🐟'},
  {id:'saclar',name:'Saclar',icon:'🫕'},
  {id:'kabablar',name:'Kabablar',icon:'🔥'},
  {id:'sendvicler',name:'Sendviçlər',icon:'🍔'},
  {id:'pizzalar',name:'Pizzalar',icon:'🍕'},
  {id:'meyveler',name:'Meyvələr',icon:'🍇'},
  {id:'desertler',name:'Desertlər',icon:'🍰'},
  {id:'isti-ickilər',name:'İsti İçkilər',icon:'☕'},
  {id:'meyvə-sulari',name:'Meyvə Suları',icon:'🥤'},
  {id:'alkoqolsuz',name:'Alkoqolsuz Kokteyllər',icon:'🍹'},
  {id:'alkoqollu',name:'Alkoqollu Kokteyllər',icon:'🍸'},
  {id:'serinlesdirici',name:'Sərinləşdiricilər',icon:'🥤'},
  {id:'piveler',name:'Pivələr',icon:'🍺'},
  {id:'araqlar',name:'Araqlar',icon:'🥃'},
  {id:'serablar',name:'Şərablar',icon:'🍷'},
  {id:'tekila',name:'Tekila',icon:'🥃'},
  {id:'viskiler',name:'Viskillər',icon:'🥃'},
  {id:'rom',name:'Rom',icon:'🥃'},
  {id:'konyak',name:'Konyak',icon:'🥃'},
  {id:'sampan',name:'Şampan',icon:'🍾'},
  {id:'martini',name:'Martini',icon:'🍸'},
  {id:'likor',name:'Likor',icon:'🍹'},
  {id:'qelyanlar',name:'Qəlyanlar',icon:'💨'}
];

let ITEMS = {};
let currentView = 'dashboard';
let filterCat = 'all';
let searchQ = '';
let editingId = null;
let editingCat = null;
let page = 1;
const PER_PAGE = 20;

function loadData() {
  const s = localStorage.getItem('ki_items_v2');
  if (s) { try { ITEMS = JSON.parse(s); } catch(e) {} }
}
function saveData() {
  localStorage.setItem('ki_items_v2', JSON.stringify(ITEMS));
}
function getAllItems() {
  const all = [];
  CATS.forEach(c => {
    (ITEMS[c.id]||[]).forEach(item => all.push({...item, catId:c.id, catName:c.name, catIcon:c.icon}));
  });
  return all;
}

// ============ INIT ============
function initApp() {
  loadData();
  renderSidebar();
  showDashboard();
}

// ============ SIDEBAR ============
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const all = getAllItems();
  let html = `
    <div class="sidebar-section">Ümumi</div>
    <div class="sidebar-item ${currentView==='dashboard'?'active':''}" onclick="showDashboard()">
      <span class="si-icon">📊</span> İdarə Paneli
    </div>
    <div class="sidebar-item ${currentView==='all'?'active':''}" onclick="showItems('all')">
      <span class="si-icon">📋</span> Bütün Məhsullar
      <span class="si-badge">${all.length}</span>
    </div>
    <div class="sidebar-item ${currentView==='add'?'active':''}" onclick="openAddModal()">
      <span class="si-icon">➕</span> Məhsul əlavə et
    </div>
    <div class="sidebar-section">Kateqoriyalar</div>`;
  CATS.forEach(c => {
    const cnt = (ITEMS[c.id]||[]).length;
    if (!cnt) return;
    html += `<div class="sidebar-item ${currentView===c.id?'active':''}" onclick="showItems('${c.id}')">
      <span class="si-icon">${c.icon}</span> ${c.name}
      <span class="si-badge">${cnt}</span>
    </div>`;
  });
  sb.innerHTML = html;
}

// ============ DASHBOARD ============
function showDashboard() {
  currentView = 'dashboard';
  renderSidebar();
  const all = getAllItems();
  const cats = CATS.filter(c => (ITEMS[c.id]||[]).length > 0).length;
  const withImg = all.filter(i => i.img).length;
  const noImg = all.filter(i => !i.img).length;

  // Recent items
  let recentRows = all.slice(0,8).map(item => `
    <tr>
      <td>${item.img ? `<img class="td-img" src="${item.img}" onerror="this.style.display='none'">` : `<div class="td-img-placeholder">${item.catIcon}</div>`}</td>
      <td><div class="td-name">${item.name}</div></td>
      <td><span class="cat-badge">${item.catName}</span></td>
      <td class="td-price">${item.price} ₼</td>
      <td><span class="status-badge status-active">Aktiv</span></td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editItem('${item.catId}','${item.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDelete('${item.catId}','${item.id}','${item.name}')">🗑️</button>
      </td>
    </tr>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="breadcrumb">Ana səhifə / <span>İdarə Paneli</span></div>
    <div class="page-header">
      <div><div class="page-title">İdarə Paneli</div><div class="page-sub">Khazar Inji Hotel & Restaurant</div></div>
      <button class="btn btn-primary" onclick="openAddModal()">➕ Məhsul əlavə et</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="sc-icon">🍽️</div><div class="sc-val">${all.length}</div><div class="sc-label">Ümumi məhsul</div></div>
      <div class="stat-card"><div class="sc-icon">📦</div><div class="sc-val">${cats}</div><div class="sc-label">Aktiv kateqoriya</div></div>
      <div class="stat-card"><div class="sc-icon">🖼️</div><div class="sc-val">${withImg}</div><div class="sc-label">Şəkilli məhsul</div></div>
      <div class="stat-card"><div class="sc-icon">⚠️</div><div class="sc-val">${noImg}</div><div class="sc-label">Şəkilsiz məhsul</div></div>
    </div>
    <div class="table-wrap">
      <div class="table-header"><span>📋 Son Məhsullar</span><button class="btn btn-secondary btn-sm" onclick="showItems('all')">Hamısını gör →</button></div>
      <table><thead><tr><th>Şəkil</th><th>Ad</th><th>Kateqoriya</th><th>Qiymət</th><th>Status</th><th>Əməliyyat</th></tr></thead>
      <tbody>${recentRows||'<tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa">Məhsul yoxdur</td></tr>'}</tbody></table>
    </div>`;
}

// ============ ITEMS LIST ============
function showItems(catId) {
  currentView = catId;
  filterCat = catId;
  page = 1;
  renderSidebar();
  renderItemsPage();
}

function renderItemsPage() {
  let all = getAllItems();
  if (filterCat !== 'all') all = all.filter(i => i.catId === filterCat);
  if (searchQ) all = all.filter(i => i.name.toLowerCase().includes(searchQ.toLowerCase()));

  const total = all.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  const paged = all.slice((page-1)*PER_PAGE, page*PER_PAGE);

  const catTitle = filterCat==='all' ? 'Bütün Məhsullar' : (CATS.find(c=>c.id===filterCat)?.name||'');

  const chips = `<div class="filter-chips">
    <div class="chip chip-all ${filterCat==='all'?'active':''}" onclick="filterByCat('all')">🍽️ Hamısı</div>
    ${CATS.filter(c=>(ITEMS[c.id]||[]).length>0).map(c=>`<div class="chip chip-cat ${filterCat===c.id?'active':''}" onclick="filterByCat('${c.id}')">${c.icon} ${c.name}</div>`).join('')}
  </div>`;

  const rows = paged.map(item => `
    <tr>
      <td>${item.img ? `<img class="td-img" src="${item.img}" onerror="this.style.display='none'">` : `<div class="td-img-placeholder">${item.catIcon}</div>`}</td>
      <td><div class="td-name">${item.name}</div>${item.desc?`<div style="font-size:11px;color:#aaa;margin-top:2px">${item.desc}</div>`:''}</td>
      <td><span class="cat-badge">${item.catName}</span></td>
      <td class="td-price">${item.price} ₼</td>
      <td><span class="status-badge status-active">Aktiv</span></td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editItem('${item.catId}','${item.id}')">✏️ Redaktə</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDelete('${item.catId}','${item.id}','${item.name}')">🗑️</button>
      </td>
    </tr>`).join('');

  const pgBtns = Array.from({length:totalPages},(_,i)=>`<button class="page-btn ${page===i+1?'active':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="breadcrumb">Ana səhifə / <span>${catTitle}</span></div>
    <div class="page-header">
      <div><div class="page-title">${catTitle}</div><div class="page-sub">${total} məhsul tapıldı</div></div>
      <button class="btn btn-primary" onclick="openAddModal('${filterCat==='all'?'':filterCat}')">➕ Məhsul əlavə et</button>
    </div>
    ${chips}
    <div class="toolbar">
      <div class="search-box">
        <span class="si">🔍</span>
        <input type="text" placeholder="Məhsul axtar..." value="${searchQ}" oninput="doSearch(this.value)">
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-header"><span>${total} məhsul</span></div>
      <table><thead><tr><th>Şəkil</th><th>Ad</th><th>Kateqoriya</th><th>Qiymət</th><th>Status</th><th>Əməliyyat</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:40px;color:#aaa"><div style="font-size:40px;margin-bottom:8px">🔍</div>Nəticə tapılmadı</td></tr>'}</tbody></table>
      ${totalPages>1?`<div class="pagination"><div class="pagination-info">${(page-1)*PER_PAGE+1}-${Math.min(page*PER_PAGE,total)} / ${total}</div><div class="pagination-btns">${pgBtns}</div></div>`:''}
    </div>`;
}

function filterByCat(id) { filterCat=id; page=1; renderItemsPage(); }
function doSearch(q) { searchQ=q; page=1; renderItemsPage(); }
function goPage(p) { page=p; renderItemsPage(); window.scrollTo(0,0); }

// ============ ADD / EDIT MODAL ============
function openAddModal(precat='') {
  editingId = null; editingCat = null;
  document.getElementById('modalTitle').textContent = '➕ Məhsul əlavə et';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editPrice').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editImg').value = '';
  document.getElementById('imgPreview').className = 'img-preview';
  fillCatSelect(precat);
  document.getElementById('itemModal').classList.add('open');
}

function editItem(catId, itemId) {
  const item = (ITEMS[catId]||[]).find(i=>i.id===itemId);
  if (!item) return;
  editingId = itemId; editingCat = catId;
  document.getElementById('modalTitle').textContent = '✏️ Məhsulu redaktə et';
  document.getElementById('editId').value = itemId;
  document.getElementById('editName').value = item.name;
  document.getElementById('editPrice').value = item.price;
  document.getElementById('editDesc').value = item.desc||'';
  document.getElementById('editImg').value = item.img||'';
  fillCatSelect(catId);
  previewImg();
  document.getElementById('itemModal').classList.add('open');
}

function fillCatSelect(selected='') {
  const sel = document.getElementById('editCat');
  sel.innerHTML = CATS.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${c.icon} ${c.name}</option>`).join('');
}

function previewImg() {
  const url = document.getElementById('editImg').value.trim();
  const prev = document.getElementById('imgPreview');
  if (url) { prev.src=url; prev.className='img-preview show'; } 
  else { prev.className='img-preview'; }
}

function saveItem() {
  const name = document.getElementById('editName').value.trim();
  const price = parseFloat(document.getElementById('editPrice').value);
  const catId = document.getElementById('editCat').value;
  const desc = document.getElementById('editDesc').value.trim()||null;
  const img = document.getElementById('editImg').value.trim()||null;
  if (!name||isNaN(price)) { showToast('Ad və qiymət mütləqdir!','error'); return; }
  if (!ITEMS[catId]) ITEMS[catId]=[];
  if (editingId) {
    const idx = ITEMS[editingCat].findIndex(i=>i.id===editingId);
    if (editingCat !== catId) {
      ITEMS[editingCat].splice(idx,1);
      ITEMS[catId].push({id:editingId,name,price,desc,img});
    } else {
      ITEMS[editingCat][idx] = {id:editingId,name,price,desc,img};
    }
    showToast('Məhsul yeniləndi! ✅','success');
  } else {
    ITEMS[catId].push({id:'item_'+Date.now(),name,price,desc,img});
    showToast('Məhsul əlavə edildi! ✅','success');
  }
  saveData();
  closeModal();
  renderSidebar();
  if (currentView==='dashboard') showDashboard();
  else renderItemsPage();
}

function closeModal() {
  document.getElementById('itemModal').classList.remove('open');
  editingId=null; editingCat=null;
}

// ============ DELETE ============
let _delCat=null, _delId=null;
function confirmDelete(catId, itemId, name) {
  _delCat=catId; _delId=itemId;
  document.getElementById('confirmMsg').textContent = `"${name}" məhsulunu silmək istədiyinizə əminsiniz?`;
  document.getElementById('confirmOverlay').classList.add('open');
  document.getElementById('confirmOk').onclick = doDelete;
}
function doDelete() {
  if (!_delCat||!_delId) return;
  ITEMS[_delCat] = (ITEMS[_delCat]||[]).filter(i=>i.id!==_delId);
  saveData(); closeConfirm();
  showToast('Məhsul silindi!','success');
  renderSidebar();
  if (currentView==='dashboard') showDashboard();
  else renderItemsPage();
}
function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  _delCat=null; _delId=null;
}

// ============ TOAST ============
function showToast(msg, type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+(type||'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
